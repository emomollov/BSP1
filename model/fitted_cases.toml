# The pinned unengineered days.
#
# The engineered scenarios each inject a defect, which makes the model's behaviour easy to
# read but leaves open whether it holds when several constraints go live at once. These
# days test that. Their outcomes were not chosen: they are drawn from distributions fitted
# to real operational output, and each was picked from a 200-day scan by what happened,
# not by tuning the model.
#
# Pinned so the days regenerate in seconds. The scan itself is a development step:
#
#     cd ../generator
#     python run_fitted.py --scan 200 --select --out ../output
#
# Regenerate the pinned days with:
#
#     python run_fitted.py --cases --out ../output
#
# Each lands in moves.csv / review.csv / detail.csv as `scenario = "fitted_<seed>"`, so
# the notebook plots it with the same chart calls as `ib_surge`.
#
# Everything in this file is synthetic: seeds and plain English only.

[[case]]
seed = 90065
pattern = "late_only_eod"
title = "Fine early, wrong by the end of the day"
description = """
All eight carrier cut-offs are forecast short, outbound backlog breaches the TOP of its \
band in the later shifts but not the current one, and the end-of-day target is missed. \
The backlog ceiling and the end-of-day target both clear - and the model pays for it by \
pushing the backlog through the BOTTOM of the band, breaking two tiers that were clean \
before the solve. That trade is legal because `ob_bl_min` sits below `ob_bl_max` and \
`eod_max` in the ladder. It also exercises the now/later shift split, which the \
engineered set barely touches: seven of the eight breach in the later partition only, \
`ib_then_eod` being the exception.
"""

[[case]]
seed = 90073
pattern = "broad"
title = "Four families at once, and it cannot fix them all"
description = """
Carrier cut-off risk, outbound backlog high in BOTH shift partitions, the end-of-day \
target and the returns ceiling all breached on the same day. Every one of them is \
reduced, none is cleared, and the returns ceiling is made eighteen times worse to buy \
that relief - it is the lowest operational tier, so it is what the ladder spends. \
Ends on `limited_by = cross_trained_people`: the model moved everyone it could and \
still fell short.
"""

[[case]]
seed = 90007
pattern = "broad"
title = "Four families at once, and the trade it makes to get there"
description = """
The contrast case to 90073, not shown in the presentation notebook. Cut-off \
risk, outbound backlog BELOW its band, the end-of-day floor and the returns ceiling all \
live at once. It ends on `limited_by = resolved`, so the model never hits a ceiling, but \
that is not the same as fixing the day: the returns breach clears outright and cut-off \
risk drops by two thirds, while both backlog-too-low tiers and the end-of-day floor are \
driven further down. The model ships harder to make the deadlines and accepts a thinner \
backlog as the price.
"""
